<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GusSo - รีเซ็ตรหัสผ่านใหม่</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Prompt', 'sans-serif'] },
          colors: {
            brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-50 min-h-screen flex items-center justify-center p-4 font-sans text-slate-700">

  <div class="bg-white max-w-md w-full rounded-3xl p-8 shadow-xl border border-brand-100">
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-2xl bg-brand-500 text-white flex items-center justify-center font-bold text-2xl mx-auto mb-3 shadow-md">G</div>
      <h1 class="text-xl font-bold text-slate-800">ตั้งรหัสผ่านใหม่ (GusSo)</h1>
      <p class="text-xs text-slate-500 mt-1">รีเซ็ตรหัสผ่านผ่านลิงก์ยืนยันทางอีเมล</p>
    </div>

    <!-- กล่องแจ้งอีเมลเป้าหมาย -->
    <div class="bg-brand-50 border border-brand-200 rounded-xl p-3 mb-4 text-xs text-brand-700">
      กำลังตั้งรหัสผ่านใหม่สำหรับ: <b id="displayEmail" class="text-brand-900">-</b>
    </div>

    <form onsubmit="handleResetSubmit(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">รหัสผ่านใหม่</label>
        <input type="password" id="newPassword" required minlength="6" placeholder="กำหนดรหัสผ่าน 6 ตัวขึ้นไป" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-400 focus:outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">ยืนยันรหัสผ่านใหม่อีกครั้ง</label>
        <input type="password" id="confirmPassword" required minlength="6" placeholder="กรอกรหัสผ่านใหม่อีกครั้ง" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-400 focus:outline-none">
      </div>

      <button type="submit" class="w-full py-3 bg-brand-500 hover:bg-brand-600 text-white rounded-xl text-sm font-semibold shadow-md transition">
        บันทึกรหัสผ่านใหม่ในระบบ
      </button>
    </form>

    <div class="text-center mt-4">
      <a href="index.html" class="text-xs text-slate-400 hover:text-brand-600">กลับไปยังหน้าร้านหลัก GusSo</a>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetEmail = urlParams.get('email');

    if (!targetEmail) {
      alert('ลิงก์นี้ไม่ถูกต้องหรือไม่ระบุอีเมล กรุณากดลิงก์จากอีเมลของคุณใหม่อีกครั้ง');
      window.location.href = 'index.html';
    } else {
      document.getElementById('displayEmail').innerText = targetEmail;
    }

    function handleResetSubmit(e) {
      e.preventDefault();
      const p1 = document.getElementById('newPassword').value;
      const p2 = document.getElementById('confirmPassword').value;

      if (p1 !== p2) {
        alert('รหัสผ่านทั้งสองช่องไม่ตรงกัน');
        return;
      }

      const STORAGE_KEY_USERS = 'gusso_users_db';
      let users = [];
      try {
        users = JSON.parse(localStorage.getItem(STORAGE_KEY_USERS) || '[]');
      } catch (err) {
        users = [];
      }

      const cleanEmail = targetEmail.trim().toLowerCase();
      let userIndex = users.findIndex(u => u.email.toLowerCase() === cleanEmail);

      if (userIndex !== -1) {
        // อัปเดตรหัสผ่านของบัญชีเดิมที่มีอยู่จริง
        users[userIndex].password = p1;
      } else {
        // ถ้ายังไม่มีในฐานข้อมูล ให้สร้างบัญชีใหม่ผูกกับอีเมลนี้ทันที
        users.push({
          name: cleanEmail.split('@')[0],
          email: cleanEmail,
          password: p1
        });
      }

      // บันทึกลง LocalStorage หลักของโดเมน
      localStorage.setItem(STORAGE_KEY_USERS, JSON.stringify(users));

      alert('เปลี่ยนรหัสผ่านสำเร็จ! ระบบได้บันทึกรหัสผ่านใหม่เรียบร้อยแล้ว คุณสามารถเข้าสู่ระบบด้วยรหัสผ่านใหม่ได้ทันที');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
